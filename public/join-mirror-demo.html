<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenMyō — Mirror peek (Join)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #ECE5DD;
    --ink-soft: #9C9285;
    --clay: #C99368;
    --clay-deep: #B5703A;
  }
  body {
    font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .card-wrap {
    width: 300px;
    height: 620px;
    background: #0a0a0a;
    border-radius: 48px;
    padding: 9px;
    box-shadow:
      0 0 0 2px #1f1f1f,
      0 28px 56px -18px rgba(0,0,0,0.55);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .card-wrap::before,
  .card-wrap::after {
    content: "";
    position: absolute;
    background: #1a1a1a;
    border-radius: 2px;
  }
  .card-wrap::before {
    left: -2px; top: 100px; width: 3px; height: 28px;
    box-shadow: 0 48px 0 #1a1a1a, 0 96px 0 #1a1a1a;
  }
  .card-wrap::after {
    right: -2px; top: 140px; width: 3px; height: 54px;
  }

  .screen {
    flex: 1;
    background: #0B0B0D;
    border-radius: 40px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .status-bar {
    flex-shrink: 0;
    height: 40px;
    padding: 12px 24px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #000;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    position: relative;
    z-index: 2;
  }
  .status-right { display: flex; align-items: center; gap: 5px; }
  .island {
    position: absolute;
    top: 7px; left: 50%;
    transform: translateX(-50%);
    width: 92px; height: 26px;
    background: #000;
    border-radius: 16px;
    z-index: 5;
  }

  .header {
    flex-shrink: 0;
    padding: 6px 12px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #000;
    color: #fff;
  }
  .h-back { color: #fff; font-size: 20px; line-height: 1; padding: 0 2px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, #FFF 0%, #FBF3E5 100%);
    flex-shrink: 0;
  }
  .h-text { flex: 1; min-width: 0; line-height: 1.15; }
  .header-name {
    font-family: "Plus Jakarta Sans", Inter, sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: #fff;
  }
  .header-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.85);
  }
  .online-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #25D366;
    margin-right: 4px;
    vertical-align: middle;
  }

  .chat {
    flex: 1;
    padding: 12px 10px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    scrollbar-width: none;
    background-color: #0B0B0D;
    background-image:
      radial-gradient(rgba(200,147,104,0.05) 1px, transparent 1px),
      radial-gradient(rgba(200,147,104,0.035) 1px, transparent 1px);
    background-size: 22px 22px, 36px 36px;
    background-position: 0 0, 11px 11px;
  }
  .chat::-webkit-scrollbar { display: none; }

  .bw { display: flex; flex-direction: column; max-width: 84%; }
  .bw.out { align-items: flex-end; align-self: flex-end; }
  .bw.in  { align-items: flex-start; align-self: flex-start; }
  .bw.anim {
    opacity: 0;
    transform: translateY(8px);
    animation: pop 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes pop {
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    padding: 7px 10px 8px;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.4;
    color: #ECE5DD;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35);
  }
  .out .bubble {
    background: linear-gradient(160deg, #5A421F 0%, #43301A 100%);
    color: #F6ECDD;
    border-top-right-radius: 2px;
  }
  .in .bubble {
    background: #1C1C1F;
    border-top-left-radius: 2px;
  }
  .ts {
    font-size: 10px;
    color: rgba(236,229,221,0.4);
    margin-top: 2px;
    padding: 0 6px;
  }

  .typing {
    display: flex; align-items: center; gap: 5px;
    padding: 10px 14px;
    background: #1C1C1F;
    border-radius: 8px;
    border-top-left-radius: 2px;
    width: fit-content;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #C99368;
    animation: bounce 1.3s ease-in-out infinite;
  }
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes bounce {
    0%,60%,100%{transform:translateY(0);opacity:.4}
    30%{transform:translateY(-5px);opacity:1}
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
    max-width: 100%;
    align-self: flex-end;
  }
  .chip {
    appearance: none;
    border: 1px solid rgba(201,147,104,0.45);
    background: rgba(28,28,31,0.92);
    color: #F6ECDD;
    font-family: Inter, sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 18px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .chip:hover, .chip:focus-visible {
    background: rgba(90,66,31,0.85);
    border-color: var(--clay);
    outline: none;
  }
  .chip:active { transform: scale(0.97); }
  .chip:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
  }

  .hint {
    align-self: center;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    padding: 4px 8px;
    opacity: 0;
    animation: pop 0.5s ease forwards 0.2s;
  }

  .input-bar {
    flex-shrink: 0;
    padding: 8px 8px 18px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #000;
  }
  .input-field {
    flex: 1;
    min-width: 0;
    background: #1C1C1F;
    border-radius: 22px;
    padding: 10px 14px;
    font-size: 13px;
    color: #6E6A63;
    min-height: 38px;
    display: flex;
    align-items: center;
  }
  .input-send {
    width: 38px; height: 38px; border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .home-indicator {
    position: absolute;
    bottom: 6px; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 4px;
    background: rgba(255,255,255,0.35);
    border-radius: 3px;
    z-index: 6;
  }

  .replay {
    position: absolute;
    bottom: 58px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 8;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(200,147,104,0.35);
    padding: 6px 12px;
    border-radius: 16px;
    cursor: pointer;
    font-family: Inter, sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .replay.show {
    opacity: 1;
    pointer-events: auto;
  }
</style>
</head>
<body>
  <div class="card-wrap" role="img" aria-label="Playful preview of chatting with The Mirror on WhatsApp">
    <div class="screen">
      <div class="status-bar">
        <span class="status-time" id="statusTime">9:41</span>
        <div class="island" aria-hidden="true"></div>
        <div class="status-right" aria-hidden="true">
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><rect x="0" y="3" width="3" height="8" rx="0.5" fill="#fff"/><rect x="4" y="2" width="3" height="9" rx="0.5" fill="#fff"/><rect x="8" y="0.5" width="3" height="10.5" rx="0.5" fill="#fff"/><rect x="12" y="0" width="3" height="11" rx="0.5" fill="rgba(255,255,255,0.35)"/></svg>
          <svg width="14" height="11" viewBox="0 0 14 11" fill="none"><path d="M7 3.2c1.5 0 2.9.6 3.9 1.5l1.1-1.2A7.1 7.1 0 0 0 7 1.2 7.1 7.1 0 0 0 2 3.5l1.1 1.2A5.4 5.4 0 0 1 7 3.2z" fill="#fff"/><path d="M7 6.2c.8 0 1.5.3 2.1.8L10.3 5.7A4.4 4.4 0 0 0 7 4.4 4.4 4.4 0 0 0 3.7 5.7l1.2 1.3A2.9 2.9 0 0 1 7 6.2z" fill="#fff"/><circle cx="7" cy="9.4" r="1.2" fill="#fff"/></svg>
          <svg width="23" height="11" viewBox="0 0 23 11" fill="none"><rect x="0.5" y="0.5" width="19" height="10" rx="2" stroke="#fff" stroke-opacity="0.4"/><rect x="2" y="2" width="14" height="7" rx="1" fill="#fff"/><path d="M21 3.5v4a1.6 1.6 0 0 0 0-4z" fill="#fff" fill-opacity="0.4"/></svg>
        </div>
      </div>

      <div class="header">
        <span class="h-back" aria-hidden="true">‹</span>
        <div class="avatar" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="#B5703A" stroke-width="1.2"/>
            <circle cx="12" cy="12" r="3.2" fill="#C99368"/>
          </svg>
        </div>
        <div class="h-text">
          <div class="header-name">The Mirror</div>
          <div class="header-sub"><span class="online-dot"></span>online</div>
        </div>
      </div>

      <div class="chat" id="chat" aria-live="polite"></div>

      <div class="input-bar" aria-hidden="true">
        <div class="input-field">Message</div>
        <div class="input-send">
          <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M3.4 20.6 21 12 3.4 3.4 3.4 10l11 2-11 2z" fill="#111"/></svg>
        </div>
      </div>
      <div class="home-indicator" aria-hidden="true"></div>
      <button type="button" class="replay" id="replay">Play again</button>
    </div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const name = (params.get("name") || "").trim().slice(0, 24);
  const chat = document.getElementById("chat");
  const replayBtn = document.getElementById("replay");
  const statusTime = document.getElementById("statusTime");

  let timers = [];
  const wait = (ms) => new Promise((r) => timers.push(setTimeout(r, ms)));
  function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
  }

  function nowLabel() {
    const d = new Date();
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  statusTime.textContent = nowLabel();

  function scrollChat() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addBubble(who, text, time) {
    const wrap = document.createElement("div");
    wrap.className = "bw " + who + " anim";
    wrap.innerHTML =
      '<div class="bubble"></div><div class="ts"></div>';
    wrap.querySelector(".bubble").textContent = text;
    wrap.querySelector(".ts").textContent = time || nowLabel();
    chat.appendChild(wrap);
    scrollChat();
    return wrap;
  }

  function showTyping() {
    const el = document.createElement("div");
    el.className = "bw in anim";
    el.id = "typing";
    el.innerHTML =
      '<div class="typing" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    chat.appendChild(el);
    scrollChat();
  }
  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  const CHOICES = [
    {
      label: "A bit stuck",
      reply: "Stuck is honest. We can sit with that — no rush to fix it.",
    },
    {
      label: "Just curious",
      reply: "Curiosity is a good door. One quiet question at a time.",
    },
    {
      label: "Need quiet",
      reply: "Then we'll keep it soft. No streaks. No noise. Just you.",
    },
  ];

  function addChips(onPick) {
    const row = document.createElement("div");
    row.className = "chips anim";
    row.setAttribute("role", "group");
    row.setAttribute("aria-label", "Try a reply");
    CHOICES.forEach((c) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "chip";
      btn.textContent = c.label;
      btn.addEventListener("click", () => {
        row.querySelectorAll(".chip").forEach((b) => (b.disabled = true));
        onPick(c);
      });
      row.appendChild(btn);
    });
    chat.appendChild(row);
    scrollChat();
    return row;
  }

  async function mirrorSay(text, delay) {
    showTyping();
    await wait(delay);
    removeTyping();
    addBubble("in", text);
  }

  async function run() {
    clearTimers();
    chat.innerHTML = "";
    replayBtn.classList.remove("show");

    const greet = name
      ? "Hey " + name + " — I'm The Mirror. I live in WhatsApp."
      : "Hey — I'm The Mirror. I live in WhatsApp.";

    await wait(400);
    await mirrorSay(greet, 700);
    await wait(350);
    await mirrorSay("Tap how you're arriving. Just a peek — the real chat starts after you join.", 900);

    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Try a reply ↓";
    chat.appendChild(hint);
    scrollChat();

    await new Promise((resolve) => {
      addChips(async (choice) => {
        hint.remove();
        addBubble("out", choice.label);
        await wait(280);
        await mirrorSay(choice.reply, 850);
        await wait(400);
        await mirrorSay(
          "Finish joining — then say hi here. I'll be waiting.",
          950
        );
        replayBtn.classList.add("show");
        resolve();
      });
    });
  }

  replayBtn.addEventListener("click", () => {
    run();
  });

  // Parent can refresh name via postMessage
  window.addEventListener("message", (e) => {
    if (!e.data || e.data.type !== "join-mirror-name") return;
    const next = String(e.data.name || "").trim().slice(0, 24);
    if (next === name) return;
    location.search = next ? "?name=" + encodeURIComponent(next) : "";
  });

  run();
})();
</script>
</body>
</html>
